name: Proton Logicals -> JSON + CF DNS

on:
  schedule:
    - cron: '0 * * * *'   # 每小时运行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch ProtonVPN Logicals, Build JSON, Push CF DNS
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          cat << 'EOF' > process_logicals.py
          # -*- coding: utf-8 -*-
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error

          # ============ 配置 ============
          SRC_URL   = "https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_logicals.json"
          OUT_JSON  = "pt-logicals.json"

          PROTON_REGIONS = ["US", "CA", "NL", "JP", "SG", "NO", "CH"]

          MAX_PER_REGION = 5       # 每地区最多提取 / 推送多少个
          MAX_LOAD       = 90      # ★ 负载超过此值视为拥堵，不作为优质节点
          CF_PREFIX      = "pt-"

          CF_DOMAIN    = os.environ.get("CF_DOMAIN", "").strip().strip(".")
          CF_ZONE_ID   = os.environ.get("CF_ZONE_ID", "").strip()
          CF_API_TOKEN = os.environ.get("CF_API_TOKEN", "").strip()

          # ============ 拉取 & 过滤 ============
          def fetch_json(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          def pick_ip(node):
              for s in node.get("Servers", []) or []:
                  if s.get("Status") == 1 and s.get("ExitIP"):
                      return s.get("ExitIP")
              return None

          def is_quality_node(node):
              if node.get("Tier") != 0:
                  return False
              if "FREE" not in (node.get("Name") or "").upper():
                  return False
              if node.get("Status") != 1:
                  return False
              servers = node.get("Servers") or []
              if not servers:
                  return False
              for s in servers:
                  if s.get("Status") != 1:
                      return False
                  if (s.get("ServicesDown") or 0) > 0:
                      return False
              # ★ 负载过高视为拥堵，不作为优质节点
              load = node.get("Load")
              if load is None or load > MAX_LOAD:
                  return False
              return True

          def build_region_nodes(logicals):
              buckets = {r: [] for r in PROTON_REGIONS}
              for node in logicals:
                  country = (node.get("ExitCountry") or "").upper()
                  if country not in buckets:
                      continue
                  if not is_quality_node(node):
                      continue
                  ip = pick_ip(node)
                  if not ip:
                      continue
                  buckets[country].append({
                      "domain": node.get("Domain"),
                      "ip": ip,
                      "name": node.get("Name"),
                      "city": node.get("City"),
                      "load": node.get("Load"),
                      "score": node.get("Score"),
                      "tier": node.get("Tier"),
                      "features": node.get("Features"),
                  })
              # ★ 排序：Score 升序（主）→ Load 升序（次）→ domain 升序（三）
              for r in buckets:
                  buckets[r].sort(key=lambda x: (
                      x["score"] if x["score"] is not None else 9999,
                      x["load"] if x["load"] is not None else 9999,
                      x["domain"] or "",
                  ))
                  buckets[r] = buckets[r][:MAX_PER_REGION]
              return {r: v for r, v in buckets.items() if v}

          # ============ Cloudflare ============
          def cf_delete_by_name(domain):
              headers = {"Authorization": f"Bearer {CF_API_TOKEN}"}
              url = (f"https://api.cloudflare.com/client/v4/zones/{CF_ZONE_ID}"
                     f"/dns_records?name={domain}")
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as response:
                      res_data = json.loads(response.read().decode('utf-8'))
                      existing = res_data.get("result", []) or []
              except Exception as e:
                  print(f"    [警告] 查询 {domain} 失败: {e}")
                  return 0

              deleted = 0
              for rec in existing:
                  del_url = (f"https://api.cloudflare.com/client/v4/zones/{CF_ZONE_ID}"
                             f"/dns_records/{rec['id']}")
                  try:
                      del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                      with urllib.request.urlopen(del_req, timeout=15):
                          pass
                      deleted += 1
                  except Exception as e:
                      print(f"    [警告] 删除 {domain} (id={rec['id']}) 失败: {e}")
              return deleted

          def cf_create_cname(domain, target):
              """创建 CNAME 记录，target 是 Proton 域名"""
              headers = {
                  "Authorization": f"Bearer {CF_API_TOKEN}",
                  "Content-Type": "application/json"
              }
              payload = {
                  "type": "CNAME",
                  "name": domain,
                  "content": target,
                  "ttl": 60,
                  "proxied": False
              }
              create_url = f"https://api.cloudflare.com/client/v4/zones/{CF_ZONE_ID}/dns_records"
              try:
                  cr_req = urllib.request.Request(
                      create_url,
                      data=json.dumps(payload).encode('utf-8'),
                      headers=headers,
                      method="POST"
                  )
                  with urllib.request.urlopen(cr_req, timeout=15) as resp:
                      body = resp.read().decode('utf-8')
                      data = json.loads(body) if body else {}
                      if data.get("success"):
                          return True
                      print(f"    [警告] 创建 {domain} 失败: {data.get('errors')}")
                      return False
              except urllib.error.HTTPError as e:
                  try:
                      err_body = e.read().decode('utf-8')
                  except Exception:
                      err_body = ""
                  print(f"    [警告] 创建 {domain} HTTP {e.code}: {err_body}")
                  return False
              except Exception as e:
                  print(f"    [警告] 创建 {domain} 异常: {e}")
                  return False

          def push_region(region, nodes):
              rl = region.lower()
              deleted = 0
              # 清理该地区 1..MAX_PER_REGION 的确定名字（CNAME 和 A 都删，避免残留）
              for idx in range(1, MAX_PER_REGION + 1):
                  d = f"{CF_PREFIX}{rl}{idx}.{CF_DOMAIN}"
                  deleted += cf_delete_by_name(d)
              print(f"  └─ [{region}] 已清理旧记录 {deleted} 条，准备推送 {len(nodes)} 条")

              pushed = 0
              for idx, node in enumerate(nodes, start=1):
                  d = f"{CF_PREFIX}{rl}{idx}.{CF_DOMAIN}"
                  # ★ 推 CNAME，target 是 Proton 域名
                  if cf_create_cname(d, node["domain"]):
                      pushed += 1
              return pushed

          def push_region_with_retry(region, nodes):
              try:
                  pushed = push_region(region, nodes)
                  if pushed == len(nodes):
                      print(f"  ✅ [{region}] 推送完成: {pushed}/{len(nodes)}")
                      return True
                  print(f"  ⚠️ [{region}] 首次推送不完整 ({pushed}/{len(nodes)})，重试一次")
              except Exception as e:
                  print(f"  ⚠️ [{region}] 首次推送异常: {e}，重试一次")

              try:
                  time.sleep(3)
                  pushed = push_region(region, nodes)
                  if pushed == len(nodes):
                      print(f"  ✅ [{region}] 重试推送完成: {pushed}/{len(nodes)}")
                      return True
                  print(f"  ❌ [{region}] 重试仍不完整 ({pushed}/{len(nodes)})，放弃该地区")
                  return False
              except Exception as e:
                  print(f"  ❌ [{region}] 重试异常: {e}，放弃该地区")
                  return False

          # ============ 主流程 ============
          def main():
              if not (CF_ZONE_ID and CF_API_TOKEN and CF_DOMAIN):
                  print("❌ 缺少 CF_ZONE_ID / CF_API_TOKEN / CF_DOMAIN")
                  sys.exit(1)

              print(f"⬇️ 拉取源 JSON: {SRC_URL}")
              data = fetch_json(SRC_URL)
              logicals = data.get("LogicalServers") or []
              print(f"   共 {len(logicals)} 个逻辑节点")

              buckets = build_region_nodes(logicals)
              if not buckets:
                  print("❌ 所有地区均无有效免费节点，任务终止")
                  sys.exit(1)

              with open(OUT_JSON, "w", encoding="utf-8") as f:
                  json.dump(buckets, f, ensure_ascii=False, indent=2)
              print(f"✅ 已写入 {OUT_JSON}")
              for r, nodes in buckets.items():
                  print(f"   - {r}: {len(nodes)} 个")

              print("\n🌐 开始推送到 Cloudflare DNS")
              ok_regions, fail_regions = [], []
              for region, nodes in buckets.items():
                  print(f"\n▶️ 处理地区 [{region}] ({len(nodes)} 个)")
                  if push_region_with_retry(region, nodes):
                      ok_regions.append(region)
                  else:
                      fail_regions.append(region)

              print("\n========== 汇总 ==========")
              print(f"成功: {ok_regions}")
              print(f"失败: {fail_regions}")

              if not ok_regions:
                  print("❌ 所有地区推送均失败")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

          python process_logicals.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add pt-logicals.json
          git diff --staged --quiet || (git commit -m "Update pt-logicals.json [skip ci]" && git push)
